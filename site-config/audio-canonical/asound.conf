# =============================================================================
# /etc/asound.conf — MINIMAL site config (2026-07-10 rewrite)
#
# This site runs LMS-only direct output (no AmpliPi-managed streams, no
# loopbacks, no alsaloop). Exactly TWO clients exist, both squeezelite user
# units, both mixing into ONE dmix on the onboard I2S DAC (source 0):
#
#   squeezelite-general  (radio) -> ch0      -> ch0_softvol(-7.1dB) -> ch0_dmix -> hw:sndrpihifiberry
#   squeezelite-announce (TTS)   -> ch0boost -> ch0boost_softvol(0dB) -> ch0_dmix -> hw:sndrpihifiberry
#
# RATE POLICY (fix once, keep forever):
#   - The mix runs at a FIXED 48000 Hz (dmix slave below).
#   - Sources vary (44.1k webradio AAC, 48k VRT streams, TTS mp3s) — the plug
#     layer converts, and defaults.pcm.rate_converter pins the QUALITY.
#     Without it libasound silently uses its built-in LINEAR interpolator,
#     which audibly crackles on music (bitten 2026-07-08..10 when the radio
#     station changed from 48k VRT to 44.1k One World Radio).
#   - speexrate_medium = quality/CPU sweet spot on this armv7 Pi 3.
#
# HISTORY / RECOVERY:
#   - Full stock config (usb71 CM6206 8ch, sources ch1-3, 24 loopback PCMs):
#     /etc/asound.conf.bak-20260710-preconverter and the stock install backup
#     at /home/pi/amplipi-stock-backup-20260610.
#   - snd-aloop was removed from /etc/modules the same day (6 phantom cards).
#   - Version-controlled copy: /home/openhab/work/amplipi-rebase (openHAB host).
# =============================================================================

defaults.pcm.rate_converter "speexrate_medium"

# Anything opening the ALSA default (aplay tests etc.) joins the radio mix.
pcm.!default {
    type            plug
    slave.pcm       "ch0"
}

# --- Radio path (padded) ---------------------------------------------------
pcm.ch0 {
    type            plug
    slave.pcm       "ch0_softvol"
    slave.channels  2
}

# -7.1 dB pad: preamp op-amps clip below ~1.4V on the negative swing
# (pre-Rev4 boards); 0.78Vrms / 1.76Vrms nominal = 0.44 -> 20*log10 = -7.1 dB.
pcm.ch0_softvol {
    type            softvol
    slave.pcm       "ch0_dmix"
    control.name    "Ch0 Volume"
    control.card    0
    max_dB          -7.1
    resolution      256
}

# The ONE mix point. Held open 24/7 by both squeezelites (no -C flag) — a
# close/reopen cycle can wedge the dmix IPC (ENODEV loop, 8h outage 2026-07-06).
# The radio-watchdog (v3.2) auto-restarts a client stuck in that state.
pcm.ch0_dmix {
    type            dmix
    ipc_key         2867
    ipc_perm        0666
    slave {
        pcm         "hw:sndrpihifiberry,0"
        period_time 0
        period_size 1024
        buffer_size 16384
        rate        48000
        channels    2
    }
}

ctl.ch0 {
    type            hw
    card            sndrpihifiberry
}

# --- Announce/siren path (unpadded = up to +7.6 dB over the radio) ----------
# Only squeezelite-announce.service uses this (TTS overlay + burglar siren).
pcm.ch0boost {
    type            plug
    slave.pcm       "ch0boost_softvol"
    slave.channels  2
}
pcm.ch0boost_softvol {
    type            softvol
    slave.pcm       "ch0_dmix"
    control.name    "Ch0 Boost"
    control.card    0
    max_dB          0.0
    resolution      256
}
